; Ninja Gaiden II (recompilado para PC)
; iso: ruta al ISO del juego (Xbox 360, version World). Vacio = se pide al arrancar
iso=
; datos: carpeta de partidas guardadas y DLC importado
datos=userdata
; dlc: carpeta donde copiar los paquetes de DLC de Xbox 360 (se importan al arrancar)
dlc=dlc
; perfil: 1 = con perfil (se puede guardar), 0 = sin perfil (no se guarda)
perfil=1
; vibracion: 1 = el mando vibra, 0 = sin vibracion
vibracion=1
; anisotropico: filtrado de texturas (0 = lineal, 2, 4, 8 o 16)
anisotropico=16
